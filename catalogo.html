<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Catálogo</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { scrollbar-width: none; }
        .card-img { aspect-ratio: 4 / 3; }
        /* Tema: la página pone --h1..--h3 (degradado), --acc (resalte), --btn y --cat según shop.color */
        :root { --h1: #0f172a; --h2: #1e293b; --h3: #312e81; --acc: #facc15; --btn: #1e1b4b; --cat: #6366f1; }
        .hdr { background: linear-gradient(135deg, var(--h1), var(--h2), var(--h3)); }
        .acc-bg { background: var(--acc); color: #0f172a; }
        .btn-add { background: var(--btn); }
        .cat-label { color: var(--cat); }
        /* Interruptor de opciones: el radio va oculto y el texto se colorea con el tema */
        .seg label { flex: 1; }
        .seg label span { display: flex; align-items: center; justify-content: center; gap: .4rem; padding: .6rem .5rem; border-radius: .7rem; font-size: .8rem; font-weight: 700; color: #475569; cursor: pointer; transition: .15s; }
        .seg input:checked + span { background: var(--btn); color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
        .seg input:focus-visible + span { outline: 2px solid var(--cat); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-32 antialiased">
    <header class="hdr text-white px-4 pt-5 pb-4 shadow-lg">
        <div class="max-w-5xl mx-auto">
            <div class="flex items-center gap-3">
                <div id="shopInitial" class="w-11 h-11 rounded-xl acc-bg font-extrabold text-xl flex items-center justify-center shrink-0 overflow-hidden"><i class="fa-solid fa-store"></i></div>
                <div class="min-w-0">
                    <h1 id="shopTitle" class="font-extrabold text-xl leading-tight truncate">Catálogo</h1>
                    <p id="shopSlogan" class="text-xs text-slate-300">Haz tu pedido y te lo confirmamos por WhatsApp</p>
                    <p id="updatedAt" class="text-[10px] text-slate-400"></p>
                </div>
            </div>
            <div id="controls" class="hidden mt-4 space-y-3">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input id="search" type="search" placeholder="Buscar producto..." class="w-full rounded-xl pl-10 pr-3 py-2.5 text-sm text-slate-800 outline-none focus:ring-2 focus:ring-yellow-400">
                </div>
                <div id="chips" class="flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4"></div>
            </div>
        </div>
    </header>

    <main class="px-3 pt-4 max-w-5xl mx-auto">
        <p id="message" class="text-center text-slate-500 py-20"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Cargando...</p>
        <button id="retryBtn" class="hidden mx-auto block bg-slate-800 text-white px-5 py-2 rounded-lg font-bold text-sm">Reintentar</button>
        <div id="list" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3"></div>
    </main>

    <div id="cartBar" class="hidden fixed bottom-0 inset-x-0 z-20 p-3">
        <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden">
            <div id="cartDetail" class="hidden max-h-52 overflow-y-auto divide-y divide-slate-100 text-sm"></div>
            <div class="flex items-center gap-3 p-3">
                <button id="cartToggle" class="flex items-center gap-2 text-left min-w-0 flex-1" aria-label="Ver pedido">
                    <span class="relative w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-basket-shopping"></i>
                        <span id="cartCount" class="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[10px] font-bold rounded-full min-w-[18px] h-[18px] flex items-center justify-center px-1"></span>
                    </span>
                    <span class="min-w-0">
                        <span class="block text-[11px] text-slate-400 leading-none">Total aproximado <i class="fa-solid fa-chevron-up text-[9px]"></i></span>
                        <span id="cartTotal" class="block font-extrabold text-lg leading-tight"></span>
                    </span>
                </button>
                <button id="orderBtn" type="button" class="bg-green-600 hover:bg-green-700 text-white font-bold px-4 py-3 rounded-xl text-sm whitespace-nowrap shadow">
                    <i class="fa-brands fa-whatsapp mr-1"></i> <span id="orderBtnText">Pedir</span>
                </button>
                <button id="orderAppBtn" type="button" class="hidden btn-add text-white font-bold px-4 py-3 rounded-xl text-sm whitespace-nowrap shadow hover:opacity-90">
                    <i class="fa-solid fa-cart-shopping mr-1"></i> Pedir
                </button>
            </div>
            <p id="cartNote" class="text-[10px] text-slate-400 text-center pb-2 -mt-1">El negocio confirmará disponibilidad y precio</p>
        </div>
    </div>

    <div id="custModal" class="hidden fixed inset-0 z-30 bg-black/50 flex items-end sm:items-center justify-center p-3">
        <div class="bg-white rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden max-h-[95vh] flex flex-col">
            <div class="hdr text-white px-4 py-3 flex items-center gap-3 shrink-0">
                <span class="w-10 h-10 rounded-xl acc-bg flex items-center justify-center shrink-0"><i id="custIcon" class="fa-solid fa-cart-shopping"></i></span>
                <div class="min-w-0">
                    <h2 id="custTitle" class="font-extrabold text-lg leading-tight">Finalizar pedido</h2>
                    <p id="custSummary" class="text-xs text-slate-300 truncate"></p>
                </div>
            </div>
            <div class="p-4 overflow-y-auto">
                <div id="custForm" class="space-y-3">
                    <div>
                        <label for="custName" class="block text-[11px] font-bold text-slate-500 mb-1">Nombre</label>
                        <input id="custName" maxlength="60" placeholder="Tu nombre" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-300">
                    </div>
                    <div id="custPhoneBox" class="hidden">
                        <label for="custPhone" class="block text-[11px] font-bold text-slate-500 mb-1">Teléfono</label>
                        <input id="custPhone" type="tel" inputmode="tel" maxlength="20" placeholder="Ej: 04141234567" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-300">
                    </div>
                    <div>
                        <p class="text-[11px] font-bold text-slate-500 mb-1">Entrega</p>
                        <div class="seg flex gap-1 bg-slate-100 rounded-2xl p-1">
                            <label><input type="radio" name="custDelivery" value="retiro" checked class="sr-only"><span><i class="fa-solid fa-store"></i>Retiro en tienda</span></label>
                            <label><input type="radio" name="custDelivery" value="delivery" class="sr-only"><span><i class="fa-solid fa-motorcycle"></i>Delivery</span></label>
                        </div>
                        <div id="custAddressBox" class="hidden mt-2">
                            <div class="flex gap-2">
                                <input id="custAddress" maxlength="120" placeholder="Dirección de entrega" class="flex-1 min-w-0 border border-slate-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-300">
                                <button id="custLocBtn" type="button" title="Usar mi ubicación" aria-label="Usar mi ubicación" class="shrink-0 w-11 rounded-xl btn-add text-white hover:opacity-90"><i class="fa-solid fa-location-dot"></i></button>
                            </div>
                            <p id="custLocMsg" class="hidden mt-1 text-[11px] font-bold"></p>
                        </div>
                    </div>
                    <div id="custPayBox" class="hidden">
                        <p class="text-[11px] font-bold text-slate-500 mb-1">¿Cómo pagas?</p>
                        <div class="seg flex gap-1 bg-slate-100 rounded-2xl p-1">
                            <label><input type="radio" name="custPay" value="contado" checked class="sr-only"><span><i class="fa-solid fa-money-bill-wave"></i>Contado</span></label>
                            <label id="custPayCreditLbl" class="hidden"><input type="radio" name="custPay" value="fiado" class="sr-only"><span><i class="fa-solid fa-handshake"></i>Fiado</span></label>
                        </div>
                    </div>
                    <input id="custNote" maxlength="200" placeholder="Nota (opcional)" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-300">
                    <p id="custError" class="text-xs text-red-600 font-bold empty:hidden"></p>
                    <div class="flex gap-2">
                        <button id="custCancel" type="button" class="flex-1 bg-slate-100 rounded-xl py-3 text-sm font-bold">Cancelar</button>
                        <button id="custSend" type="button" class="flex-[2] btn-add text-white rounded-xl py-3 text-sm font-bold shadow"><i class="fa-solid fa-paper-plane mr-1"></i>Enviar pedido</button>
                    </div>
                    <p id="custPrivacy" class="hidden text-[10px] text-slate-400 text-center">Tu nombre y teléfono se envían solo a esta tienda para atender tu pedido.</p>
                </div>
                <div id="custDone" class="hidden space-y-3 text-center">
                    <p class="font-bold text-green-700"><i class="fa-solid fa-circle-check mr-1"></i>¡Pedido enviado! La tienda lo revisará y te contactará.</p>
                    <button id="custClose" type="button" class="w-full bg-slate-100 rounded-xl py-3 text-sm font-bold">Cerrar</button>
                </div>
                <button id="custWaAlert" type="button" class="hidden mt-3 w-full bg-green-600 text-white rounded-xl py-3 text-sm font-bold"><i class="fa-brands fa-whatsapp mr-1"></i>Avisar por WhatsApp</button>
            </div>
        </div>
    </div>

<script>
    // Sin SDK de Firebase: solo lee el JSON público que publica la app.
    const BUCKET = 'ejecomercio-27f57.firebasestorage.app';
    const PHOTO_PREFIX = 'https://firebasestorage.googleapis.com/';
    const $ = (id) => document.getElementById(id);
    // Copia de escapeHtml de js/08-rates-utils.js
    const escapeHtml = (v) => String(v ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

    const DEFAULT_SLOGAN = 'Haz tu pedido y te lo confirmamos por WhatsApp';
    const THEMES = {
        indigo: ['#0f172a', '#1e293b', '#312e81', '#facc15', '#1e1b4b', '#6366f1'],
        verde: ['#052e16', '#14532d', '#166534', '#a3e635', '#14532d', '#16a34a'],
        rojo: ['#450a0a', '#7f1d1d', '#991b1b', '#fbbf24', '#7f1d1d', '#dc2626'],
        azul: ['#082f49', '#0c4a6e', '#075985', '#38bdf8', '#0c4a6e', '#0284c7'],
        morado: ['#3b0764', '#581c87', '#6b21a8', '#f0abfc', '#581c87', '#9333ea'],
        oscuro: ['#0a0a0a', '#171717', '#262626', '#facc15', '#262626', '#737373']
    };
    // apiKey de firebaseConfig: pública por diseño; la seguridad está en las reglas de Firestore
    const FS_PROJECT = 'ejecomercio-27f57', FS_API_KEY = 'AIzaSyBMjRVdh6_3-eqOlxFpjjIPOJhWgIsaJOo';
    let shop = { title: 'Catálogo', whatsapp: '', slogan: '', color: 'indigo', logo: '', askCustomer: false, orderMode: 'whatsapp', allowCredit: false };
    let shopUid = '';
    let currency = '$', rate = null, products = [], activeCat = '', updatedAt = null;
    const cart = new Map(); // id -> cantidad

    const fmt = (n) => Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function showMessage(text, retry) {
        $('message').textContent = text;
        $('message').classList.remove('hidden');
        $('retryBtn').classList.toggle('hidden', !retry);
        $('list').innerHTML = '';
        $('controls').classList.add('hidden');
        $('cartBar').classList.add('hidden');
    }

    // Tolera JSON viejo, incompleto o de una versión futura: cada campo tiene valor por defecto.
    // Los productos agotados no se muestran.
    function normalize(data) {
        data = data && typeof data === 'object' ? data : {};
        const s = (typeof data.shop === 'object' && data.shop) || {};
        shop = {
            title: String(s.title || 'Catálogo'),
            whatsapp: String(s.whatsapp || '').replace(/\D/g, ''),
            slogan: String(s.slogan || '').trim().slice(0, 80),
            color: THEMES[s.color] ? s.color : 'indigo',
            logo: typeof s.logo === 'string' && s.logo.startsWith(PHOTO_PREFIX) ? s.logo : '',
            askCustomer: s.askCustomer === true,
            orderMode: ['app', 'both'].includes(s.orderMode) ? s.orderMode : 'whatsapp',
            allowCredit: s.allowCredit === true
        };
        const d = new Date(data.updatedAt);
        updatedAt = isNaN(d) ? null : d;
        currency = typeof data.currency === 'string' && data.currency ? data.currency : '$';
        rate = Number(data.rate) > 0 ? Number(data.rate) : null;
        products = (Array.isArray(data.products) ? data.products : [])
            .filter(p => p && p.name && Number(p.price) > 0 && p.available !== false)
            .map((p, i) => ({
                id: String(p.id ?? 'p' + i),
                name: String(p.name),
                category: String(p.category || '').trim() || 'Otros',
                price: Number(p.price),
                photo: typeof p.photo === 'string' && p.photo.startsWith(PHOTO_PREFIX) ? p.photo : '',
                stock: Number.isInteger(p.stock) && p.stock >= 0 ? p.stock : null
            }));
    }

    function renderUpdated() {
        const el = $('updatedAt');
        if (!updatedAt) { el.textContent = ''; return; }
        const min = Math.floor((Date.now() - updatedAt) / 60000);
        const time = updatedAt.toLocaleTimeString('es', { hour: 'numeric', minute: '2-digit', hour12: true });
        let t;
        if (min < 1) t = 'hace un momento';
        else if (min < 60) t = `hace ${min} min`;
        else if (updatedAt.toDateString() === new Date().toDateString()) t = `hoy a las ${time}`;
        else t = `el ${String(updatedAt.getDate()).padStart(2, '0')}/${String(updatedAt.getMonth() + 1).padStart(2, '0')} a las ${time}`;
        el.textContent = 'Actualizada ' + t;
    }
    setInterval(renderUpdated, 60000);

    async function load() {
        const params = new URLSearchParams(location.search);
        const slug = params.get('t') || '';
        let uid = params.get('u') || '';
        // ?t= es el nombre corto (tienda/{nombre}.json = { u: uid }); ?u= es el enlace de siempre
        if (slug ? !/^[a-z0-9][a-z0-9-]{1,28}[a-z0-9]$/.test(slug) : !/^[A-Za-z0-9]+$/.test(uid)) return showMessage('Esta vitrina no está disponible');
        showMessage('Cargando...');
        $('message').innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Cargando...';
        try {
            // El parámetro t cambia cada minuto (igual que max-age del archivo): evita que una caché vieja sirva un catálogo desactualizado
            const t = Math.floor(Date.now() / 60000);
            if (slug) {
                const r = await fetch(`https://firebasestorage.googleapis.com/v0/b/${BUCKET}/o/tienda%2F${slug}.json?alt=media&t=${t}`);
                if (r.status === 404 || r.status === 403) return showMessage('Esta vitrina no está disponible');
                if (!r.ok) throw new Error('HTTP ' + r.status);
                uid = String((await r.json()).u || '');
                if (!/^[A-Za-z0-9]+$/.test(uid)) return showMessage('Esta vitrina no está disponible');
            }
            const res = await fetch(`https://firebasestorage.googleapis.com/v0/b/${BUCKET}/o/catalogo%2F${uid}.json?alt=media&t=${t}`);
            if (res.status === 404 || res.status === 403) return showMessage('Esta vitrina no está disponible');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            normalize(await res.json());
            shopUid = uid;
        } catch (e) {
            console.warn('Vitrina:', e);
            return showMessage('Sin conexión. Intenta de nuevo', true);
        }
        $('shopTitle').textContent = shop.title;
        applyTheme();
        renderUpdated();
        document.title = shop.title;
        if (!products.length) return showMessage('No hay productos disponibles por ahora');
        $('message').classList.add('hidden');
        $('retryBtn').classList.add('hidden');
        $('controls').classList.remove('hidden');
        activeCat = '';
        renderChips();
        render();
    }

    // Tema, logo y lema de la vitrina; sin logo (o si no carga) se muestra la inicial del negocio
    function applyTheme() {
        const t = THEMES[shop.color];
        ['--h1', '--h2', '--h3', '--acc', '--btn', '--cat'].forEach((v, i) => document.documentElement.style.setProperty(v, t[i]));
        document.querySelector('meta[name=theme-color]').content = t[0];
        $('shopSlogan').textContent = shop.slogan || DEFAULT_SLOGAN;
        const box = $('shopInitial');
        const initial = () => { box.className = box.className.replace(' bg-white', ''); box.textContent = shop.title.trim().charAt(0).toUpperCase() || '?'; };
        if (shop.logo) {
            box.classList.add('bg-white');
            box.innerHTML = '';
            const img = document.createElement('img');
            img.alt = '';
            img.className = 'w-full h-full object-contain';
            img.onerror = initial;
            img.src = shop.logo;
            box.appendChild(img);
        } else initial();
    }

    function renderChips() {
        const cats = [...new Set(products.map(p => p.category))].sort((a, b) => a === 'Otros' ? 1 : b === 'Otros' ? -1 : a.localeCompare(b, 'es'));
        const chip = (c, label) => `<button data-cat="${escapeHtml(c)}" class="shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold transition ${c === activeCat ? 'acc-bg' : 'bg-white/10 text-white hover:bg-white/20'}">${escapeHtml(label)}</button>`;
        $('chips').innerHTML = cats.length > 1 ? chip('', 'Todo') + cats.map(c => chip(c, c)).join('') : '';
    }

    function render() {
        const q = $('search').value.trim().toLowerCase();
        const shown = products.filter(p => (!activeCat || p.category === activeCat) && (!q || p.name.toLowerCase().includes(q)));
        $('list').innerHTML = shown.length ? shown.map(p => {
            const qty = cart.get(p.id) || 0, id = escapeHtml(p.id), full = p.stock !== null && qty >= p.stock;
            const left = p.stock !== null ? `<div class="text-[11px] font-bold ${p.stock <= 5 ? 'text-amber-600' : 'text-slate-400'}">Quedan ${p.stock}</div>` : '';
            const bs = rate ? `<div class="text-[11px] text-slate-400">Bs ${fmt(p.price * rate)}</div>` : '';
            const img = p.photo
                ? `<img src="${escapeHtml(p.photo)}" loading="lazy" alt="" class="card-img w-full object-cover bg-slate-100">`
                : '<div class="card-img w-full bg-gradient-to-br from-slate-100 to-slate-200 flex items-center justify-center text-slate-300 text-4xl"><i class="fa-solid fa-box-open"></i></div>';
            const action = qty
                ? `<div class="flex items-center justify-between bg-slate-100 rounded-xl p-1"><button data-act="dec" data-id="${id}" class="w-9 h-9 rounded-lg bg-white shadow-sm font-bold text-lg active:scale-95">−</button><span class="font-extrabold">${qty}</span><button data-act="inc" data-id="${id}" ${full ? 'disabled' : ''} class="w-9 h-9 rounded-lg bg-green-600 text-white shadow-sm font-bold text-lg active:scale-95 disabled:opacity-40">+</button></div>`
                : `<button data-act="inc" data-id="${id}" class="btn-add w-full hover:opacity-90 text-white rounded-xl py-2.5 text-sm font-bold active:scale-95 transition"><i class="fa-solid fa-plus mr-1 text-xs"></i>Añadir</button>`;
            return `<div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex flex-col">${img}
                <div class="p-3 flex-1 flex flex-col gap-0.5"><div class="text-[10px] uppercase tracking-wide cat-label font-bold truncate">${escapeHtml(p.category)}</div>
                <div class="text-sm font-bold leading-snug line-clamp-2">${escapeHtml(p.name)}</div>
                <div class="mt-1 text-lg font-extrabold text-slate-900">${escapeHtml(currency)} ${fmt(p.price)}</div>${bs}${left}
                <div class="mt-auto pt-2">${action}</div></div></div>`;
        }).join('') : '<p class="col-span-full text-center text-slate-500 py-16">Sin resultados</p>';
        renderCart();
    }

    function renderCart() {
        const items = [...cart].map(([id, n]) => ({ p: products.find(x => x.id === id), n })).filter(x => x.p);
        $('cartBar').classList.toggle('hidden', !items.length);
        if (!items.length) return;
        const total = items.reduce((s, x) => s + x.p.price * x.n, 0);
        $('cartCount').textContent = items.reduce((s, x) => s + x.n, 0);
        $('cartDetail').innerHTML = items.map(x => `<div class="flex justify-between gap-3 px-4 py-2"><span class="min-w-0 truncate">${x.n}× ${escapeHtml(x.p.name)}</span><span class="font-bold shrink-0">${escapeHtml(currency)}${fmt(x.p.price * x.n)}</span></div>`).join('');
        $('cartTotal').textContent = `${currency}${fmt(total)}`;
        orderText = `Hola ${shop.title}, quiero hacer este pedido:\n` +
            items.map(x => `- ${x.n}x ${x.p.name} (${currency}${fmt(x.p.price * x.n)})`).join('\n') +
            `\nTotal aproximado: ${currency}${fmt(total)}`;
        $('cartNote').textContent = products.some(p => p.stock !== null)
            ? 'La tienda podrá cumplir tu pedido según la disponibilidad de los productos.'
            : 'El negocio confirmará disponibilidad y precio';
        // Un botón por vía: WhatsApp (si hay número) y/o el carrito de la página; con ambos, el de WhatsApp se llama «WhatsApp»
        $('orderBtn').classList.toggle('hidden', shop.orderMode === 'app' || !shop.whatsapp);
        $('orderBtnText').textContent = shop.orderMode === 'both' ? 'WhatsApp' : 'Pedir';
        $('orderAppBtn').classList.toggle('hidden', shop.orderMode === 'whatsapp');
        $('custSummary').textContent = `${shop.title} · ${items.reduce((s, x) => s + x.n, 0)} producto(s) · ${currency}${fmt(total)}`;
    }

    let orderText = '';
    const sendOrder = (extra) => window.open(`https://wa.me/${shop.whatsapp}?text=${encodeURIComponent(orderText + extra)}`, '_blank', 'noopener');
    const getSaved = () => { try { return JSON.parse(localStorage.getItem('vitrina_cliente')) || {}; } catch (e) { return {}; } };
    const delivery = () => document.querySelector('input[name=custDelivery]:checked').value;
    const syncAddress = () => $('custAddressBox').classList.toggle('hidden', delivery() !== 'delivery');

    // Ubicación (pin): enlace de Google Maps que se une a la dirección. Cabe en el tope de 120 letras de las reglas.
    let custLoc = '';
    function setLocMsg(text, ok) {
        const m = $('custLocMsg');
        m.textContent = text;
        m.className = 'mt-1 text-[11px] font-bold ' + (ok ? 'text-green-700' : 'text-red-600') + (text ? '' : ' hidden');
    }
    const locMaxAddress = () => 120 - (custLoc ? custLoc.length + 1 : 0);
    function syncAddressLimit() { $('custAddress').maxLength = locMaxAddress(); }
    $('custLocBtn').addEventListener('click', () => {
        if (!navigator.geolocation) return setLocMsg('Tu navegador no permite usar la ubicación. Escribe la dirección.', false);
        setLocMsg('Buscando tu ubicación...', true);
        navigator.geolocation.getCurrentPosition(pos => {
            custLoc = `https://maps.google.com/?q=${pos.coords.latitude.toFixed(6)},${pos.coords.longitude.toFixed(6)}`;
            $('custAddress').value = $('custAddress').value.slice(0, locMaxAddress());
            syncAddressLimit();
            setLocMsg('Ubicación añadida. Puedes escribir también una referencia.', true);
        }, err => setLocMsg(err.code === 1 ? 'No diste permiso. Escribe la dirección.' : 'No se pudo obtener tu ubicación. Escribe la dirección.', false),
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
    });
    const fullAddress = () => [$('custAddress').value.trim(), custLoc].filter(Boolean).join(' ');

    let modalApp = false; // true: el pedido va a la bandeja de la tienda; false: por WhatsApp
    let lastWaExtra = '';

    function openOrderModal(app) {
        modalApp = app;
        const sv = getSaved();
        $('custName').value = sv.name || '';
        $('custPhone').value = sv.phone || '';
        $('custAddress').value = (sv.address || '').replace(/https:\/\/maps\.google\.com\S*/, '').trim();
        custLoc = '';
        syncAddressLimit();
        setLocMsg('', true);
        $('custError').textContent = '';
        // En la app: teléfono obligatorio, forma de pago y aviso de privacidad; la nota solo va por WhatsApp
        $('custPhoneBox').classList.toggle('hidden', !app);
        $('custPayBox').classList.toggle('hidden', !app);
        $('custPayCreditLbl').classList.toggle('hidden', !shop.allowCredit);
        document.querySelector('input[name=custPay][value=contado]').checked = true;
        document.querySelector('input[name=custDelivery][value=retiro]').checked = true;
        syncAddress();
        $('custPrivacy').classList.toggle('hidden', !app);
        $('custNote').classList.toggle('hidden', app);
        $('custIcon').className = app ? 'fa-solid fa-cart-shopping' : 'fa-brands fa-whatsapp';
        $('custSend').className = 'flex-[2] text-white rounded-xl py-3 text-sm font-bold shadow ' + (app ? 'btn-add' : 'bg-green-600');
        $('custSend').innerHTML = app ? '<i class="fa-solid fa-paper-plane mr-1"></i>Enviar pedido' : '<i class="fa-brands fa-whatsapp mr-1"></i>Enviar por WhatsApp';
        $('custWaAlert').classList.add('hidden');
        $('custForm').classList.remove('hidden');
        $('custDone').classList.add('hidden');
        $('custModal').classList.remove('hidden');
    }

    $('orderBtn').addEventListener('click', () => { if (shop.askCustomer) openOrderModal(false); else sendOrder(''); });
    $('orderAppBtn').addEventListener('click', () => openOrderModal(true));
    document.querySelectorAll('input[name=custDelivery]').forEach(r => r.addEventListener('change', syncAddress));
    $('custCancel').addEventListener('click', () => $('custModal').classList.add('hidden'));
    $('custClose').addEventListener('click', () => $('custModal').classList.add('hidden'));
    $('custWaAlert').addEventListener('click', () => sendOrder(lastWaExtra));

    const fsStr = (v) => ({ stringValue: String(v) });
    // POST a la API REST de Firestore (sin SDK). Las reglas validan forma y tamaño; el pedido no lleva precios.
    async function postOrder(o) {
        const fields = {
            v: { integerValue: '1' }, name: fsStr(o.name), phone: fsStr(o.phone), pay: fsStr(o.pay), delivery: fsStr(o.delivery),
            items: { arrayValue: { values: o.items.map(i => ({ mapValue: { fields: { id: fsStr(i.id), n: { integerValue: String(i.n) }, name: fsStr(i.name.slice(0, 80)) } } })) } },
            at: { timestampValue: new Date().toISOString() }
        };
        if (o.delivery === 'delivery') fields.address = fsStr(o.address);
        const r = await fetch(`https://firestore.googleapis.com/v1/projects/${FS_PROJECT}/databases/(default)/documents/users/${encodeURIComponent(shopUid)}/pedidos?key=${FS_API_KEY}`,
            { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields }) });
        if (!r.ok) throw Object.assign(new Error('HTTP ' + r.status), { status: r.status });
    }

    $('custSend').addEventListener('click', async () => {
        const name = $('custName').value.trim(), address = fullAddress(), note = $('custNote').value.trim();
        const phone = $('custPhone').value.replace(/\D/g, '');
        const isDelivery = delivery() === 'delivery';
        if (!name) return $('custError').textContent = 'Escribe tu nombre';
        if (modalApp && !/^\d{7,15}$/.test(phone)) return $('custError').textContent = 'Escribe tu teléfono (de 7 a 15 números)';
        if (isDelivery && !address) return $('custError').textContent = 'Escribe la dirección de entrega';
        if (isDelivery && address.length > 120 && modalApp) return $('custError').textContent = 'La dirección es muy larga (máximo 120 letras)';
        try { localStorage.setItem('vitrina_cliente', JSON.stringify({ name, phone, address: $('custAddress').value.trim() })); } catch (e) { /* modo privado */ }
        const extra = `\nNombre: ${name}\nEntrega: ${isDelivery ? 'Delivery — Dirección: ' + address : 'Retiro en tienda'}` + (note ? `\nNota: ${note}` : '');
        if (!modalApp) {
            sendOrder(extra);
            $('custModal').classList.add('hidden');
            return;
        }
        const items = [...cart].map(([id, n]) => ({ p: products.find(x => x.id === id), n })).filter(x => x.p).map(x => ({ id: x.p.id, n: x.n, name: x.p.name }));
        if (!items.length || items.length > 50) return $('custError').textContent = items.length ? 'Son demasiados productos en un pedido (máximo 50)' : 'Tu pedido está vacío';
        const btn = $('custSend'), both = shop.orderMode === 'both' && !!shop.whatsapp;
        btn.disabled = true;
        $('custError').textContent = 'Enviando...';
        try {
            await postOrder({ name, phone, address, delivery: isDelivery ? 'delivery' : 'retiro', pay: shop.allowCredit && document.querySelector('input[name=custPay]:checked').value === 'fiado' ? 'fiado' : 'contado', items });
            cart.clear();
            render();
            lastWaExtra = extra;
            $('custError').textContent = '';
            $('custWaAlert').classList.toggle('hidden', !both);
            $('custForm').classList.add('hidden');
            $('custDone').classList.remove('hidden');
        } catch (e) {
            console.warn('Pedido no enviado:', e);
            // 403 también ocurre si la hora del teléfono está desfasada más de 10 minutos
            $('custError').textContent = (e.status === 403 ? 'La tienda no está recibiendo pedidos ahora (revisa también la hora de tu teléfono).' : 'No se pudo enviar el pedido. Revisa tu conexión.') + (both ? ' Puedes pedir por WhatsApp.' : '');
            if (both) { lastWaExtra = extra; $('custWaAlert').classList.remove('hidden'); }
        } finally { btn.disabled = false; }
    });

    $('list').addEventListener('click', (e) => {
        const b = e.target.closest('button[data-act]');
        if (!b) return;
        const id = b.dataset.id, p = products.find(x => x.id === id);
        let n = (cart.get(id) || 0) + (b.dataset.act === 'inc' ? 1 : -1);
        if (p && p.stock !== null) n = Math.min(n, p.stock);
        if (n > 0) cart.set(id, n); else cart.delete(id);
        render();
    });
    $('chips').addEventListener('click', (e) => {
        const b = e.target.closest('button[data-cat]');
        if (!b) return;
        activeCat = b.dataset.cat;
        renderChips();
        render();
    });
    $('cartToggle').addEventListener('click', () => $('cartDetail').classList.toggle('hidden'));
    $('search').addEventListener('input', render);
    $('retryBtn').addEventListener('click', load);
    load();
</script>
</body>
</html>
